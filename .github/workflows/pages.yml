name: Deploy public website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static pages and project-path links
        run: python3 tools/check_site.py
      - name: Prepare public files only
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml .nojekyll LICENSE.md THIRD_PARTY_NOTICES.md _site/
          cp -R assets how-it-works supported-inputs guides faq changelog privacy legal _site/
          rm _site/assets/media/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
